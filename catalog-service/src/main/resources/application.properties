spring.datasource.url=jdbc:postgresql://localhost:5433/orderflow
spring.datasource.username=orderflow
spring.datasource.password=orderflow
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-bytes-for-hs256}
jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG

admin.email=admin@orderflow.com
admin.password=${ADMIN_PASSWORD:admin123}

# Shared secret for service-to-service calls
internal.api-key=${INTERNAL_API_KEY:}

# Send our error messages (e.g. "Images must be 5 MB or smaller") to the frontend
server.error.include-message=always
