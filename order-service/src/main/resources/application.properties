spring.datasource.url=jdbc:postgresql://localhost:5434/orderflow_orders
spring.datasource.username=orderflow
spring.datasource.password=orderflow
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-bytes-for-hs256}

aws.sqs.endpoint=http://localhost:4566
aws.sqs.queue-url=http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/order-events
aws.region=us-east-1

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

catalog.base-url=${CATALOG_BASE_URL:http://localhost:8080}
# Send our error messages (e.g. "Only 3 left of X") to the frontend
server.error.include-message=always
