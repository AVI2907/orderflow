name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button: test and deploy everything

# One deploy at a time per branch; never cancel a deploy halfway through
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::449629364716:role/orderflow-github-deploy
  ECR_REGISTRY: 449629364716.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: orderflow-cluster
  FRONTEND_BUCKET: orderflow-frontend-449629364716
  CLOUDFRONT_ID: E1V4XYIHWG3JT9
  SITE_URL: https://d2j1wxboivmdi8.cloudfront.net

jobs:
  # Which parts of the repo changed in this push?
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      catalog: ${{ steps.filter.outputs.catalog }}
      order: ${{ steps.filter.outputs.order }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            catalog:
              - 'catalog-service/**'
            order:
              - 'order-service/**'
            frontend:
              - 'frontend/**'

  test-backend:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw && ./mvnw -B -q test

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build
        working-directory: frontend
        run: npm ci && npm run build

  deploy-catalog:
    name: Deploy catalog-service
    needs: [changes, test-backend, build-frontend]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.catalog == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets GitHub prove its identity to AWS (no stored keys)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: catalog-service/pom.xml
      - name: Build jar (tests already passed)
        working-directory: catalog-service
        run: chmod +x mvnw && ./mvnw -B -q package -DskipTests
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        working-directory: catalog-service
        run: |
          IMAGE=$ECR_REGISTRY/orderflow-catalog-service
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: Roll out on ECS and wait until healthy
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service catalog-service --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services catalog-service
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/products")
            [ "$code" = "200" ] && echo "catalog-service is live" && exit 0
            echo "attempt $i: HTTP $code"; sleep 15
          done
          echo "::error::catalog-service did not come back healthy"; exit 1

  deploy-order:
    name: Deploy order-service
    needs: [changes, test-backend, build-frontend]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.order == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: order-service/pom.xml
      - name: Build jar (tests already passed)
        working-directory: order-service
        run: chmod +x mvnw && ./mvnw -B -q package -DskipTests
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        working-directory: order-service
        run: |
          IMAGE=$ECR_REGISTRY/orderflow-order-service
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: Roll out on ECS and wait until healthy
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service order-service --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services order-service
      - name: Smoke test
        run: |
          # Any answer below 500 means order-service is up (an unauthenticated request should get 401/403)
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/orders/buyer/00000000-0000-0000-0000-000000000000")
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then echo "order-service is live (HTTP $code)"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 15
          done
          echo "::error::order-service did not come back healthy"; exit 1

  deploy-frontend:
    name: Deploy frontend
    needs: [changes, test-backend, build-frontend]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Stripe publishable key
        working-directory: frontend
        env:
          KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "VITE_STRIPE_PUBLISHABLE_KEY=$KEY" > .env.production; fi
          grep -q '^VITE_STRIPE_PUBLISHABLE_KEY=pk_' .env.production 2>/dev/null \
            || { echo "::error::Set the VITE_STRIPE_PUBLISHABLE_KEY repository variable"; exit 1; }
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload to S3
        working-directory: frontend
        run: |
          # 1. Hashed JS/CSS first: safe to cache forever, since every change gets a new file name
          aws s3 sync dist/assets s3://$FRONTEND_BUCKET/assets --delete \
            --cache-control "public,max-age=31536000,immutable"
          # 2. index.html and the rest last, never cached, so visitors always get the newest version
          aws s3 sync dist s3://$FRONTEND_BUCKET --delete --exclude "assets/*" \
            --cache-control "no-cache"
      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*" > /dev/null
